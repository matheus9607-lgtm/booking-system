<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set92 | Booking</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header id="main-header">
        <div class="logo">SET92</div>
    </header>

    <main>
        <section id="studios" class="rooms">
            <div class="container">
                <div class="room-grid" id="room-grid-container">
                    <!-- Rooms loaded dynamically from admin data -->
                </div>
            </div>
        </section>

        <!-- Booking Modal -->
        <div id="booking-modal" class="modal" style="display: none;">
            <div class="modal-content">
                <span class="close-modal" onclick="closeBooking()">&times;</span>

                <div class="modal-layout">
                    <div class="modal-main">
                        <div class="calendar-controls">
                            <div style="display: flex; gap: 1rem; align-items: center;">
                                <h2 id="calendar-month-year">Novembro 2025</h2>
                                <button class="show-morning-btn" id="morning-btn" onclick="toggleMorningHours()">Mostrar
                                    horários da manhã</button>
                            </div>
                            <div class="calendar-actions">
                                <button class="btn-icon" onclick="toggleDatePicker()" title="Selecionar data">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                        stroke-width="2">
                                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                                        <line x1="16" y1="2" x2="16" y2="6"></line>
                                        <line x1="8" y1="2" x2="8" y2="6"></line>
                                        <line x1="3" y1="10" x2="21" y2="10"></line>
                                    </svg>
                                </button>
                                <button class="btn-outline" onclick="goToToday()">Hoje</button>
                                <button class="nav-btn" onclick="changeWeek(-1)">&lt;</button>
                                <button class="nav-btn" onclick="changeWeek(1)">&gt;</button>
                            </div>
                        </div>

                        <div class="week-grid-container">
                            <!-- Generated by JS -->
                        </div>

                        <!-- Date Picker Popup -->
                        <div id="date-picker" class="date-picker-popup" style="display: none;">
                            <div class="date-picker-content">
                                <!-- Generated by JS -->
                            </div>
                        </div>
                    </div>

                    <div class="modal-sidebar">
                        <h3>Reserva</h3>
                        <div class="sidebar-info">
                            <div class="info-item">
                                <span class="label">Local</span>
                                <span class="value" id="sidebar-room-name">-</span>
                            </div>
                            <div class="info-item">
                                <span class="label">Data</span>
                                <span class="value" id="sidebar-date">-</span>
                            </div>
                            <div class="info-item">
                                <span class="label">Horário</span>
                                <span class="value" id="sidebar-time">-</span>
                            </div>
                            <div class="info-item">
                                <span class="label">Total</span>
                                <span class="value" id="sidebar-total">R$ 0,00</span>
                            </div>
                        </div>

                        <div class="booking-form"
                            style="margin-top: 1.5rem; border-top: 1px solid #eee; padding-top: 1rem;">
                            <div class="form-group" style="margin-bottom: 1rem;">
                                <label for="customer-name"
                                    style="display: block; margin-bottom: 0.5rem; font-size: 0.9rem; color: #666;">Nome
                                    Completo</label>
                                <input type="text" id="customer-name" class="form-control" placeholder="Seu nome"
                                    style="width: 100%; padding: 0.8rem; border: 1px solid #ddd; border-radius: 8px;">
                            </div>
                            <div class="form-group" style="margin-bottom: 1rem;">
                                <label for="customer-phone"
                                    style="display: block; margin-bottom: 0.5rem; font-size: 0.9rem; color: #666;">Telefone
                                    (WhatsApp)</label>
                                <input type="tel" id="customer-phone" class="form-control" placeholder="(00) 00000-0000"
                                    style="width: 100%; padding: 0.8rem; border: 1px solid #ddd; border-radius: 8px;">
                            </div>
                        </div>

                        <button class="btn" style="width: 100%; margin-top: var(--spacing-md);"
                            onclick="confirmBooking()">Prosseguir para agendamento</button>
                        <p class="terms-text">Ao clicar em "Prosseguir para agendamento", você concorda com nossos
                            termos
                            e
                            condições.</p>
                    </div>
                </div>
            </div>
        </div>

        <div id="toast-container"></div>
        <script src="script.js"></script>
</body>

</html>
